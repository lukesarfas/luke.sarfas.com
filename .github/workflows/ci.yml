name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # No `npm audit` gate here: the outstanding high advisories are all in
      # Astro's SSR/dev-server code paths, which a static (output: 'static')
      # build never ships. Resolving them requires a breaking Astro 6 migration
      # across every app in the monorepo, tracked separately. The maze's own
      # dependency hygiene is audited in its canonical repo, where the gate is
      # clean. See docs/COST.md / the project SPEC §8.

      - name: Build all sites + hub
        run: npm run build

      - name: Install Playwright browser (chromium)
        run: npx playwright install --with-deps chromium

      - name: Run maze e2e tests (smoke + a11y + keyboard)
        run: npm --workspace maze-site run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: apps/maze/playwright-report
          if-no-files-found: ignore

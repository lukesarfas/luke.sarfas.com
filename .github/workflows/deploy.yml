name: Build & Deploy

on:
  push:
    branches: [main]
  repository_dispatch:
    types: [project-updated]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build all sites + hub
        run: npm run build

      # --- Launch-smoke gate -------------------------------------------------
      # Runs after the build and BEFORE deploy, in the same job and sequentially,
      # so a smoke failure blocks the Firebase deploy. The test:smoke script is
      # defined in maze-site's package.json (owned by another agent).
      - name: Install Playwright browser (chromium)
        run: npx playwright install --with-deps chromium

      - name: Launch smoke test
        run: npm --workspace maze-site run test:smoke

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: luke-sarfas-personal

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 270 570" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FBF5EE"/>
      <stop offset="1" stop-color="#F5ECE1"/>
    </linearGradient>
  </defs>
  <rect width="270" height="570" fill="url(#bg)"/>
  <rect x="20" y="70" width="230" height="18" rx="4" fill="#E9DED4"/>
  <rect x="20" y="102" width="160" height="14" rx="3" fill="#E9DED4" opacity="0.7"/>
  <rect x="20" y="140" width="230" height="1" fill="#E9DED4"/>
  <g fill="#2A2422" font-family="ui-serif, Georgia, serif" font-size="14">
    <text x="20" y="170">Sunday morning —</text>
    <text x="20" y="192" fill="#6B5E57">went for a walk along the canal</text>
    <text x="20" y="210" fill="#6B5E57">with Mia. She seemed quieter than</text>
    <text x="20" y="228" fill="#6B5E57">usual; I didn't press.</text>
    <text x="20" y="260">Coffee at Prufrock.</text>
    <text x="20" y="282" fill="#6B5E57">The beans are different this week,</text>
    <text x="20" y="300" fill="#6B5E57">brighter, a bit of cherry.</text>
  </g>
  <circle cx="32" cy="190" r="3" fill="#E8A384"/>
  <circle cx="32" cy="280" r="3" fill="#E8A384"/>
  <rect x="20" y="520" width="230" height="40" rx="20" fill="#2A2422"/>
  <text x="135" y="545" text-anchor="middle" fill="#FBF5EE" font-family="-apple-system" font-size="13" font-weight="600">New entry</text>
</svg>
